<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
          crossorigin="anonymous">

    <link rel="icon" type="image/jpeg" href="static/images/bidemlik.jpg">

    <style>

        .flex-md-equal > * {
            flex: 1;
        }


        /* =========================
           ANA MENÜ
        ========================= */

        .hero-section {

            position: relative;
            overflow: hidden;

            min-height: 600px;

            background-image: url("static/images/restorant.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .hero-section::before {

            content: "";

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.55);
        }


        .hero-content {

            position: relative;

            z-index: 2;

            transform: translateY(80px);
        }


        .hero-content h1 {

            color: white;
        }


        /* =========================
           MENÜ KARTLARI
        ========================= */

        .hot-drinks,
        .cold-drinks,
        .aperatives,
        .breakfasts,
        .desserts,
        .nargile {

            position: relative;

            overflow: hidden;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 250px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: inherit;

            text-decoration: none;
        }


        /* SICAK */

        .hot-drinks {

            background-image: url("static/images/kahve.jpg");
        }


        /* SOĞUK */

        .cold-drinks {

            background-image: url("static/images/soguk.jpg");
        }


        /* APERATİF */

        .aperatives {

            background-image: url("static/images/patates.jpg");
        }


        /* TATLI */

        .breakfasts {

            background-image: url("static/images/kahvalti.jpg");
        }

        .desserts {

            background-image: url("static/images/tatlilar.jpg");
        }

        .nargile {

            background-image: url("static/images/nargile.png");
        }


        /* =========================
           FOTOĞRAF KARARTMA
        ========================= */

        .hot-drinks::before,
        .cold-drinks::before,
        .aperatives::before,
        .breakfasts::before,
        .desserts::before,
        .nargile::before {

            content: "";

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.45);
        }


        /* =========================
           YAZILAR
        ========================= */

        .hot-drinks h2,
        .cold-drinks h2,
        .aperatives h2,
        .breakfasts h2,
        .desserts h2,
        .nargile h2 {

            position: relative;

            z-index: 2;

            color: white !important;
        }


        /* ==================================================
           TELEFON
        ================================================== */

        @media (max-width: 767px) {


            /* ANA FOTOĞRAF */

            .hero-section {

                min-height: 350px;

                margin: 0 !important;

                padding: 20px !important;
            }


            /* MENÜ YAZISI */

            .hero-content {

                transform: translateY(40px);

                margin: 0 !important;

                padding: 0 !important;
            }


            /*
             Bootstrap'ın display-5
             boyutunu koruyoruz.
            */

            .hero-content h1 {

                color: white;
            }


            /* =====================================
               SATIRLAR
            ===================================== */

            .d-md-flex {

                display: flex !important;

                flex-direction: row !important;

                width: 100% !important;

                margin: 8px 0 !important;

                padding: 0 8px !important;

                gap: 8px;
            }


            /* =====================================
               KARTLAR
            ===================================== */

            .hot-drinks,
            .cold-drinks,
            .aperatives,
            .breakfasts,
            .desserts,
            .nargile {

                width: 50%;

                min-height: 180px;

                height: 180px;

                margin: 0 !important;

                padding: 10px !important;
            }


            /* =====================================
               BOŞLUKLARI TEMİZLE
            ===================================== */

            .hot-drinks .my-3,
            .cold-drinks .my-3,
            .aperatives .my-3,
            .breakfasts .my-3,
            .desserts .my-3,
            .nargile .my-3 {

                margin: 0 !important;

                padding: 0 !important;
            }

        }


        /* ==========================================
           KÜÇÜK TELEFONLAR
        ========================================== */

        @media (max-width: 400px) {

            .hero-section {

                min-height: 320px;
            }


            .hot-drinks,
            .cold-drinks,
            .aperatives,
            .breakfasts,
            .desserts,
            .nargile {

                min-height: 160px;

                height: 160px;
            }

        }

    </style>


    <title>Menü</title>

</head>


<body>

<main>


    <!-- =========================
         MENÜ
    ========================= -->

    <div class="hero-section p-3 p-md-5 m-md-3 text-center">

        <div class="col-md-6 p-lg-5 mx-auto my-5 hero-content">

            <h1 class="display-5 menu-title">

                MENÜ

            </h1>

        </div>

    </div>


    <!-- =========================
         1. SATIR
    ========================= -->

    <div class="d-md-flex flex-md-equal w-100 my-md-3 ps-md-3">


        <a href="hot-menu.html"
           class="hot-drinks me-md-3 pt-3 px-3 pt-md-5 px-md-5 text-center text-decoration-none">


            <div class="my-3 py-3">

                <h2 class="display-5">

                    SICAK İÇECEKLER

                </h2>

            </div>


        </a>


        <a href="cold-menu.html"
           class="cold-drinks me-md-3 pt-3 px-3 pt-md-5 px-md-5 text-center text-decoration-none">


            <div class="my-3 p-3">

                <h2 class="display-5">

                    SOĞUK İÇECEKLER

                </h2>

            </div>


        </a>


    </div>


    <!-- =========================
         2. SATIR
    ========================= -->

    <div class="d-md-flex flex-md-equal w-100 my-md-3 ps-md-3">


        <a href="aperative-menu.html"
           class="aperatives me-md-3 pt-3 px-3 pt-md-5 px-md-5 text-center text-decoration-none">


            <div class="my-3 p-3">

                <h2 class="display-5">

                    APERATİFLER

                </h2>

            </div>


        </a>


        <a href="kahvalti.html"
           class="breakfasts me-md-3 pt-3 px-3 pt-md-5 px-md-5 text-center text-decoration-none">


            <div class="my-3 py-3">

                <h2 class="display-5">

                    KAHVALTI

                </h2>

            </div>


        </a>


    </div>

    <!-- =========================
         3. SATIR
    ========================= -->

    <div class="d-md-flex flex-md-equal w-100 my-md-3 ps-md-3">


        <a href="tatlılar.html"
           class="desserts me-md-3 pt-3 px-3 pt-md-5 px-md-5 text-center text-decoration-none">


            <div class="my-3 p-3">

                <h2 class="display-5">

                    TATLILAR

                </h2>

            </div>


        </a>


        <a href="nargile.html"
           class="nargile me-md-3 pt-3 px-3 pt-md-5 px-md-5 text-center text-decoration-none">


            <div class="my-3 py-3">

                <h2 class="display-5">

                    NARGİLELER

                </h2>

            </div>


        </a>

    </div>    


</main>

</body>

</html>
