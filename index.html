		<style>
			/* POP-UP ARKA PLANI */
			.popup-overlay {
				position: fixed;
				inset: 0;
				z-index: 99999;

				display: flex;
				align-items: center;
				justify-content: center;

				padding: 20px;
				background: rgba(0, 0, 0, 0.78);

				opacity: 1;
				visibility: visible;

				transition: opacity 0.3s ease,
							visibility 0.3s ease;
			}

			/* POP-UP KUTUSU */
			.popup-box {
				position: relative;
				width: 100%;
				max-width: 420px;
				box-sizing: border-box;

				padding: 28px 24px;
				border-radius: 16px;

				background: #222222;
				color: #ffffff;
				text-align: center;

				border: 1px solid rgba(255, 255, 255, 0.15);
				box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);

				animation: popupAppear 0.35s ease;
			}

			/* KAPATMA ÇARPI İŞARETİ */
			.popup-close {
				position: absolute;
				top: 10px;
				right: 10px;
				z-index: 2;

				width: 38px;
				height: 38px;
				padding: 0;

				border: none;
				border-radius: 50%;

				background: rgba(0, 0, 0, 0.75);
				color: white;

				font-size: 30px;
				line-height: 38px;
				text-align: center;

				cursor: pointer;
			}

			.popup-close:hover {
				background: #b99354;
				color: #111111;
			}

			/* POP-UP FOTOĞRAFI */
			.popup-image {
				display: block;
				width: 100%;
				height: 380px;
				object-fit: cover;
				object-position: center;
				border-radius: 10px;
				margin: 0 0 22px 0;
			}

			/* BAŞLIK */
			.popup-box h2 {
				color: #ffffff;
				font-size: 23px;
				line-height: 1.4;
				margin: 0 0 14px 0;
			}

			/* AÇIKLAMA */
			.popup-box p {
				color: #dddddd;
				font-size: 15px;
				line-height: 1.7;
				margin: 0 0 22px 0;
			}

			/* MENÜ BUTONU */
			.popup-button {
				display: inline-block;
				padding: 12px 24px;

				border-radius: 8px;
				background: #b99354;
				color: #111111 !important;

				font-size: 13px;
				font-weight: bold;
				text-decoration: none;

				transition: background 0.2s ease;
			}

			.popup-button:hover {
				background: #d2b477;
			}

			/* AÇILIŞ ANİMASYONU */
			@keyframes popupAppear {
				from {
					opacity: 0;
					transform: translateY(15px) scale(0.95);
				}

				to {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
			}

			/* MOBİL UYUMLULUK */
			@media (max-width: 480px) {
			.popup-box {
				max-width: 350px;
				padding: 24px 18px;
			}

			.popup-image {
				height: 300px;
			}

			.popup-box h2 {
				font-size: 20px;
			}

			.popup-box p {
				font-size: 14px;
			}
		}

			/* HAREKETİ AZALTMA TERCİHİ */
			@media (prefers-reduced-motion: reduce) {
				.popup-overlay,
				.popup-box {
					animation: none;
					transition: none;
				}
			}
		</style>

			<script>
				const popupOverlay = document.getElementById("popupOverlay");
				const popupClose = document.getElementById("popupClose");

				function closePopup() {
					popupOverlay.style.opacity = "0";
					popupOverlay.style.visibility = "hidden";
					popupOverlay.style.pointerEvents = "none";
				}

				// Sağ üstteki X butonu
				popupClose.addEventListener("click", closePopup);

				// ESC tuşuyla kapatma
				document.addEventListener("keydown", function(event) {
					if (event.key === "Escape") {
						closePopup();
					}
				});

				// Karanlık alana tıklayınca kapatma
				popupOverlay.addEventListener("click", function(event) {
					if (event.target === popupOverlay) {
						closePopup();
					}
				});
			</script>
